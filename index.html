<html>
  <head>
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css"
      integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb"
      crossorigin="anonymous"
    />
  </head>

  <body style="background: #d9d9d9">
    <div class="container">
      <div class="row">
        <div class="col d-flex justify-content-center">
          <br />

          <div class="calculadora">
            <input
              type="text"
              class="form-control resultado"
              placeholder="0"
              disabled="disabled"
            />

            <div class="row">
              <button
                type="button"
                class="btn btn-dark btn-lg clear font-weight-light"
                onclick="limpar()"
              >
                C
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarOperador('/')"
              >
                /
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarOperador('x')"
              >
                x
              </button>
            </div>

            <div class="row">
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('7')"
              >
                7
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('8'
                )"
              >
                8
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('9')"
              >
                9
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarOperador('-')"
              >
                -
              </button>
            </div>

            <div class="row">
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('4'
                )"
              >
                4
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('5')"
              >
                5
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('6')"
              >
                6
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarOperador('+')"
              >
                +
              </button>
            </div>

            <div class="row">
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('1')"
              >
                1
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('2')"
              >
                2
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('3')"
              >
                3
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg enter"
                onclick="calcular('=')"
              >
                =
              </button>
            </div>

            <div class="row" style="margin-top: -60px">
              <button
                type="button"
                class="btn btn-dark zero btn-lg font-weight-light"
                onclick="adicionarValor('0')"
              >
                0
              </button>
              <button
                type="button"
                class="btn btn-dark btn-lg font-weight-light"
                onclick="adicionarValor('.')"
              >
                .
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
